# Deprecated compatibility alias. New callers should use deploy-github-pages.yml.
name: Deploy GitHub Pages (compatibility alias)

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the artifact produced by actions/upload-pages-artifact
        required: false
        type: string
        default: github-pages
    outputs:
      page_url:
        description: URL of the deployed GitHub Pages site
        value: ${{ jobs.deploy_github_pages.outputs.page_url }}

jobs:
  deploy_github_pages:
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-github-pages.yml
    with:
      artifact_name: ${{ inputs.artifact_name }}
