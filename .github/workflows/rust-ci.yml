name: Rust CI

on:
  workflow_call:
    inputs:
      rust_toolchain:
        description: Rust toolchain override; empty uses rust-toolchain.toml or the runner default
        required: false
        type: string
        default: ""
      working_directory:
        description: Cargo workspace root
        required: false
        type: string
        default: "."
      quality_runner:
        description: Runner used for rustfmt and Clippy
        required: false
        type: string
        default: ubuntu-latest
      test_runners:
        description: JSON array of runners used for tests
        required: false
        type: string
        default: '["ubuntu-latest"]'
      build_runner:
        description: Runner used to build the workspace
        required: false
        type: string
        default: ubuntu-latest
      clippy_args:
        description: Whitespace-separated Cargo arguments for Clippy
        required: false
        type: string
        default: "--workspace --all-targets"
      test_args:
        description: Whitespace-separated Cargo arguments for tests
        required: false
        type: string
        default: "--workspace --no-fail-fast"
      doc_args:
        description: Whitespace-separated Cargo arguments for documentation
        required: false
        type: string
        default: "--no-deps"
      package_args:
        description: Whitespace-separated Cargo arguments for packaging
        required: false
        type: string
        default: ""
      build_args:
        description: Whitespace-separated Cargo arguments for build
        required: false
        type: string
        default: "--workspace --all-targets"
      run_fmt:
        description: Run rustfmt
        required: false
        type: boolean
        default: true
      run_clippy:
        description: Run Clippy
        required: false
        type: boolean
        default: true
      run_tests:
        description: Run tests
        required: false
        type: boolean
        default: true
      run_docs:
        description: Build documentation with warnings denied
        required: false
        type: boolean
        default: false
      run_package:
        description: Check that the Cargo package can be created
        required: false
        type: boolean
        default: false
      run_build:
        description: Build the workspace
        required: false
        type: boolean
        default: true
      cache:
        description: Cache Cargo dependencies and build artifacts
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and Clippy
    if: ${{ inputs.run_fmt || inputs.run_clippy || inputs.run_docs || inputs.run_package }}
    runs-on: ${{ inputs.quality_runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: themoretheless/.github/.github/actions/setup-rust@6ff5952f2356f9bddc1ba6e266218d3bd0a4a993 # v1
        with:
          rust-toolchain: ${{ inputs.rust_toolchain }}
          components: rustfmt,clippy
          working-directory: ${{ inputs.working_directory }}
          cargo-workspaces: "${{ inputs.working_directory }} -> target"
          cache: ${{ inputs.cache }}

      - name: Check formatting
        if: ${{ inputs.run_fmt }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: ${{ inputs.run_clippy }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          CLIPPY_ARGS: ${{ inputs.clippy_args }}
        run: |
          set -euo pipefail

          args=()
          if [[ -n "$CLIPPY_ARGS" ]]; then
            read -r -a args <<< "$CLIPPY_ARGS"
          fi

          cargo clippy "${args[@]}" -- -D warnings

      - name: Build documentation
        if: ${{ inputs.run_docs }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          DOC_ARGS: ${{ inputs.doc_args }}
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail

          args=()
          if [[ -n "$DOC_ARGS" ]]; then
            read -r -a args <<< "$DOC_ARGS"
          fi

          cargo doc "${args[@]}"

      - name: Check package
        if: ${{ inputs.run_package }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          PACKAGE_ARGS: ${{ inputs.package_args }}
        run: |
          set -euo pipefail

          args=()
          if [[ -n "$PACKAGE_ARGS" ]]; then
            read -r -a args <<< "$PACKAGE_ARGS"
          fi

          cargo package "${args[@]}"

  build:
    name: Build
    if: ${{ inputs.run_build }}
    runs-on: ${{ inputs.build_runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: themoretheless/.github/.github/actions/setup-rust@6ff5952f2356f9bddc1ba6e266218d3bd0a4a993 # v1
        with:
          rust-toolchain: ${{ inputs.rust_toolchain }}
          working-directory: ${{ inputs.working_directory }}
          cargo-workspaces: "${{ inputs.working_directory }} -> target"
          cache: ${{ inputs.cache }}

      - name: Build workspace
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail

          args=()
          if [[ -n "$BUILD_ARGS" ]]; then
            read -r -a args <<< "$BUILD_ARGS"
          fi

          cargo build "${args[@]}"

  test:
    name: Test (${{ matrix.runner }})
    if: ${{ inputs.run_tests }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.test_runners) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: themoretheless/.github/.github/actions/setup-rust@6ff5952f2356f9bddc1ba6e266218d3bd0a4a993 # v1
        with:
          rust-toolchain: ${{ inputs.rust_toolchain }}
          working-directory: ${{ inputs.working_directory }}
          cargo-workspaces: "${{ inputs.working_directory }} -> target"
          cache: ${{ inputs.cache }}

      - name: Run tests
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TEST_ARGS: ${{ inputs.test_args }}
        run: |
          set -euo pipefail

          args=()
          if [[ -n "$TEST_ARGS" ]]; then
            read -r -a args <<< "$TEST_ARGS"
          fi

          cargo test "${args[@]}"
