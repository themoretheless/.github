name: Rust CI

on:
  workflow_call:
    inputs:
      rust_toolchain:
        description: Rust toolchain override; empty uses rust-toolchain.toml or the runner default
        required: false
        type: string
        default: ""
      working_directory:
        description: Cargo workspace root
        required: false
        type: string
        default: "."
      quality_runner:
        description: Runner used for rustfmt and Clippy
        required: false
        type: string
        default: ubuntu-latest
      test_runners:
        description: JSON array of runners used for tests
        required: false
        type: string
        default: '["ubuntu-latest"]'
      clippy_args:
        description: Whitespace-separated Cargo arguments for Clippy
        required: false
        type: string
        default: "--workspace --all-targets"
      test_args:
        description: Whitespace-separated Cargo arguments for tests
        required: false
        type: string
        default: "--workspace --no-fail-fast"
      run_fmt:
        description: Run rustfmt
        required: false
        type: boolean
        default: true
      run_clippy:
        description: Run Clippy
        required: false
        type: boolean
        default: true
      run_tests:
        description: Run tests
        required: false
        type: boolean
        default: true
      cache:
        description: Cache Cargo dependencies and build artifacts
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and Clippy
    if: ${{ inputs.run_fmt || inputs.run_clippy }}
    runs-on: ${{ inputs.quality_runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Rust toolchain
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
        run: |
          set -euo pipefail

          if [[ -n "$RUST_TOOLCHAIN" ]]; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
            rustup override set "$RUST_TOOLCHAIN"
          fi

          rustup component add rustfmt clippy
          rustc --version --verbose
          cargo --version

      - name: Cache Rust dependencies
        if: ${{ inputs.cache }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: "${{ inputs.working_directory }} -> target"

      - name: Check formatting
        if: ${{ inputs.run_fmt }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: ${{ inputs.run_clippy }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          CLIPPY_ARGS: ${{ inputs.clippy_args }}
        run: |
          set -euo pipefail

          args=()
          if [[ -n "$CLIPPY_ARGS" ]]; then
            read -r -a args <<< "$CLIPPY_ARGS"
          fi

          cargo clippy "${args[@]}" -- -D warnings

  test:
    name: Test (${{ matrix.runner }})
    if: ${{ inputs.run_tests }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.test_runners) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Rust toolchain
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
        run: |
          set -euo pipefail

          if [[ -n "$RUST_TOOLCHAIN" ]]; then
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
            rustup override set "$RUST_TOOLCHAIN"
          fi

          rustc --version --verbose
          cargo --version

      - name: Cache Rust dependencies
        if: ${{ inputs.cache }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: "${{ inputs.working_directory }} -> target"

      - name: Run tests
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TEST_ARGS: ${{ inputs.test_args }}
        run: |
          set -euo pipefail

          args=()
          if [[ -n "$TEST_ARGS" ]]; then
            read -r -a args <<< "$TEST_ARGS"
          fi

          cargo test "${args[@]}"
