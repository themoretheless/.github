name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the artifact produced by actions/upload-pages-artifact
        required: false
        type: string
        default: github-pages
    outputs:
      page_url:
        description: URL of the deployed GitHub Pages site
        value: ${{ jobs.deploy_github_pages.outputs.page_url }}

jobs:
  deploy_github_pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ inputs.artifact_name }}
