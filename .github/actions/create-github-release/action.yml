name: Create GitHub release
description: Create an annotated tag and GitHub Release for a validated package version

inputs:
  tag:
    description: Release tag
    required: true
  prerelease:
    description: Whether to mark the GitHub Release as a prerelease
    required: true
  tag-exists:
    description: Whether the validated tag already exists
    required: false
    default: "false"
  github-token:
    description: GitHub token allowed to push tags and create releases
    required: true
  release-name:
    description: GitHub Release title; defaults to the release tag
    required: false
    default: ""
  files:
    description: Newline-separated release asset paths or glob patterns
    required: false
    default: ""
  fail-on-unmatched-files:
    description: Whether to fail when any release asset pattern matches no files
    required: false
    default: "true"
  remote:
    description: Git remote to receive the tag
    required: false
    default: origin

outputs:
  url:
    description: GitHub Release URL
    value: ${{ steps.release.outputs.url }}

runs:
  using: composite
  steps:
    - name: Create tag and GitHub Release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
        FAIL_ON_UNMATCHED_FILES: ${{ inputs.fail-on-unmatched-files }}
        FILES: ${{ inputs.files }}
        PRERELEASE: ${{ inputs.prerelease }}
        RELEASE_NAME: ${{ inputs.release-name }}
        REMOTE: ${{ inputs.remote }}
        TAG: ${{ inputs.tag }}
        TAG_EXISTS: ${{ inputs.tag-exists }}
      run: '"${ACTION_PATH}/release.sh"'
