name: Setup Rust web toolchain
description: Set up Node.js, Rust/WASM tools, and build caches

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22.13.0"
  rust-version:
    description: Rust toolchain version
    required: false
    default: "1.96.0"
  rust-targets:
    description: Comma-separated Rust targets
    required: false
    default: "wasm32-unknown-unknown"
  npm-cache-dependency-path:
    description: Path to the npm lockfile
    required: false
    default: "package-lock.json"
  cargo-workspaces:
    description: Cargo workspaces passed to rust-cache
    required: false
    default: ". -> target"
  wasm-pack-version:
    description: wasm-pack version
    required: false
    default: "0.14.0"
  wasm-bindgen-cli-version:
    description: wasm-bindgen-cli version
    required: false
    default: "0.2.125"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.npm-cache-dependency-path }}

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: ${{ inputs.rust-version }}
        targets: ${{ inputs.rust-targets }}

    - name: Cache Rust build
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: ${{ inputs.cargo-workspaces }}
        key: wasm-pack-${{ inputs.wasm-pack-version }}-wasm-bindgen-${{ inputs.wasm-bindgen-cli-version }}

    - name: Install WebAssembly build tools
      uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
      with:
        tool: "wasm-pack@${{ inputs.wasm-pack-version }},wasm-bindgen-cli@${{ inputs.wasm-bindgen-cli-version }}"
        fallback: none
