name: Setup Vue toolchain
description: Set up Node.js and the npm dependency cache for a Vue project

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22.13.0"
  npm-cache-dependency-path:
    description: Path to the npm lockfile
    required: false
    default: "package-lock.json"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.npm-cache-dependency-path }}
