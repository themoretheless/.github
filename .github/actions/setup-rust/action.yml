name: Setup Rust toolchain
description: Set up a Rust toolchain, targets, tools, and the Cargo build cache

inputs:
  rust-toolchain:
    description: Rust toolchain override; empty uses rust-toolchain.toml or the runner default
    required: false
    default: ""
  components:
    description: Space- or comma-separated rustup components
    required: false
    default: ""
  targets:
    description: Space- or comma-separated rustup targets
    required: false
    default: ""
  tools:
    description: Comma-separated Cargo package specs, optionally pinned as package@version
    required: false
    default: ""
  working-directory:
    description: Cargo workspace root
    required: false
    default: "."
  cargo-workspaces:
    description: Newline-separated Cargo workspaces in "workspace -> target" form
    required: false
    default: ". -> target"
  cache-key:
    description: Additional cache key, useful for feature or target matrices
    required: false
    default: ""
  cache:
    description: Cache Cargo dependencies and build artifacts
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Select Rust toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMPONENTS: ${{ inputs.components }}
        RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail

        if [[ -n "$RUST_TOOLCHAIN" ]]; then
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
        fi

        if [[ -n "$COMPONENTS" ]]; then
          components=${COMPONENTS//,/ }
          read -r -a args <<< "$components"
          rustup component add "${args[@]}"
        fi

        if [[ -n "$TARGETS" ]]; then
          targets=${TARGETS//,/ }
          read -r -a args <<< "$targets"
          rustup target add "${args[@]}"
        fi

        rustc --version --verbose
        cargo --version

    - name: Prepare Rust cache
      id: rust-cache
      if: ${{ inputs.cache == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
        CARGO_WORKSPACES: ${{ inputs.cargo-workspaces }}
        TOOLS: ${{ inputs.tools }}
      run: bash "$GITHUB_ACTION_PATH/prepare-cache.sh"

    - name: Cache Rust dependencies
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.rust-cache.outputs.paths }}
        key: rust-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust-cache.outputs.toolchain }}-${{ steps.rust-cache.outputs.tools }}-${{ steps.rust-cache.outputs.scope }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml') }}
        restore-keys: |
          rust-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust-cache.outputs.toolchain }}-${{ steps.rust-cache.outputs.tools }}-${{ steps.rust-cache.outputs.scope }}-

    - name: Install Cargo tools
      if: ${{ inputs.tools != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLS: ${{ inputs.tools }}
      run: bash "$GITHUB_ACTION_PATH/install-cargo-tools.sh"
